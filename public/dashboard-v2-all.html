<!doctype html>
<!--
  Dashboard redesign v2 — ALL-IN-ONE switcher
  One file, 4 directions. Tab bar swaps a full-page iframe between:
    A · Trading Terminal   → dashboard-v2-terminal.html
    B · Command Center     → dashboard-v2-command.html
    C · Status Board       → dashboard-v2-bold.html
    D · Card Grid          → dashboard-v2-cards.html
  Each direction stays in its own file (full CSS isolation, no class collisions).
  Keyboard: 1/2/3/4 to switch. Last-viewed tab persisted in localStorage.
-->
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard redesign v2 — 4 directions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #f0b90b; --brand-subtle: rgba(240,185,11,0.12);
      --text: #eaecef; --text-2: #b7bdc6; --muted: #848e9c;
      --canvas: #0a0a0b; --surface: #14181f; --elevated: #1e2329;
      --border: #2b3139; --border-subtle: #1e2329;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--canvas); color: var(--text);
      font-family: Inter, -apple-system, system-ui, sans-serif;
      display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
    }
    header {
      flex: 0 0 auto; display: flex; align-items: center; gap: 18px;
      padding: 0 18px; height: 54px;
      background: linear-gradient(180deg,#15151a,#0c0c0e);
      border-bottom: 1px solid var(--border-subtle);
    }
    .brand {
      font-family: "Press Start 2P", monospace; font-size: 12px; color: var(--brand);
      letter-spacing: .04em; white-space: nowrap;
    }
    .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
    @media (max-width: 760px) { .sub { display: none; } }
    nav { margin-left: auto; display: flex; gap: 6px; background: var(--elevated); padding: 4px; border-radius: 10px; border: 1px solid var(--border-subtle); }
    .tab {
      appearance: none; cursor: pointer; border: 0; background: transparent;
      color: var(--text-2); font-family: inherit; font-size: 13px; font-weight: 500;
      padding: 7px 13px; border-radius: 7px; display: inline-flex; align-items: center; gap: 7px;
      transition: background .15s ease, color .15s ease;
    }
    .tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .tab.active { background: var(--brand); color: #1a1300; font-weight: 600; }
    .tab .k { font-family: "JetBrains Mono", monospace; font-size: 10px; opacity: .6; }
    .tab.active .k { opacity: .55; }
    .tab .label-long { }
    @media (max-width: 980px) { .tab .label-long { display: none; } }
    .frame-wrap { flex: 1 1 auto; position: relative; min-height: 0; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--canvas); }
  </style>
</head>
<body>
  <header>
    <span class="brand">COIN98</span>
    <span class="sub">Dashboard redesign · 4 hướng — bấm tab hoặc phím 1–4</span>
    <nav role="tablist" aria-label="Design directions">
      <button class="tab" data-dir="a" data-src="dashboard-v2-terminal.html"><span class="k">1</span>A<span class="label-long"> · Terminal</span></button>
      <button class="tab" data-dir="b" data-src="dashboard-v2-command.html"><span class="k">2</span>B<span class="label-long"> · Command</span></button>
      <button class="tab" data-dir="c" data-src="dashboard-v2-bold.html"><span class="k">3</span>C<span class="label-long"> · Status Board</span></button>
      <button class="tab" data-dir="d" data-src="dashboard-v2-cards.html"><span class="k">4</span>D<span class="label-long"> · Card Grid</span></button>
    </nav>
  </header>
  <div class="frame-wrap">
    <iframe id="view" title="Dashboard direction preview" src="dashboard-v2-cards.html"></iframe>
  </div>

  <script>
    (function () {
      var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
      var frame = document.getElementById('view');
      var KEY = 'dash-v2-tab';
      var byDir = {};
      tabs.forEach(function (t) { byDir[t.dataset.dir] = t; });

      function select(dir, save) {
        var tab = byDir[dir] || byDir['d'];
        if (frame.getAttribute('src') !== tab.dataset.src) frame.setAttribute('src', tab.dataset.src);
        tabs.forEach(function (t) {
          var on = t === tab;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        if (save) { try { localStorage.setItem(KEY, dir); } catch (e) {} }
      }

      tabs.forEach(function (t) {
        t.addEventListener('click', function () { select(t.dataset.dir, true); });
      });

      document.addEventListener('keydown', function (e) {
        if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
        var map = { '1': 'a', '2': 'b', '3': 'c', '4': 'd' };
        if (map[e.key]) { select(map[e.key], true); }
      });

      var saved;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      select(saved && byDir[saved] ? saved : 'd', false);
    })();
  </script>
</body>
</html>
